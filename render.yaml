services:
  # Despliegue PaaS en Render (Web Service Gratuito)
  - type: web
    name: pagobolsista-api
    runtime: python
    buildCommand: "pip install -r services/api/requirements.txt"
    startCommand: "uvicorn services.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV
        value: render_cloud_paas
      - key: DRY_RUN
        value: "true"
      # Para conectar el servicio en la nube al broker CloudAMQP:
      - key: AMQP_URL
        sync: false  # Se configura en el panel de Render con la URL de CloudAMQP
      # Para conectar a AWS Lambda en producción:
      - key: LAMBDA_URL
        sync: false  # Opcional: Function URL de AWS Lambda
